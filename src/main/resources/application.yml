server:
  servlet:
    session:
      cookie:
        same-site: lax

security:
  admin:
    enabled: false  # Set to true in production to enforce JWT auth on /admin/api/**

admin:
  default-email: ${ADMIN_EMAIL:admin@system.local}
  bootstrap:
    enabled: true  # Set to false to disable auto-creation of default SUPER_ADMIN

spring:
  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false

  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    protocol: smtp
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

  datasource:
    url: jdbc:mysql://localhost:3306/passwordless?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.jdbc.time_zone: UTC
    # show-sql: true   # bật nếu muốn xem SQL khi dev

  liquibase:
    enabled: false

otp:
  attempts: 5
  resendAllowedAfterMinutes: 1
  settings:
    - id: "sms"
      name: "Dummy SMS OTP Setting"
      messageTitle: "Acme LLC"
      messageTemplate: "Confirmation code: ${otp}"
      otpLength: 6
      useLetters: false
      useDigits: true
      ttlMinutes: 3
      sender: "dummyOTPSender"

    - id: "twilioSms"
      name: "Twilio SMS OTP Setting"
      messageTitle: "Acme LLC"
      messageTemplate: "Confirmation code: ${otp}"
      otpLength: 6
      useLetters: false
      useDigits: true
      ttlMinutes: 3
      sender: "twilioOTPSender"

    - id: "emailLink"
      name: "Email Link OTP Setting"
      messageTitle: "Acme LLC"
      messageTemplate: >
        Click the following link to confirm your action:
        http://localhost:8080/confirm?otp=${otp}&operationId=${operationId}
      otpLength: 20
      useLetters: true
      useDigits: true
      ttlMinutes: 10
      sender: "emailOtpSender"

    - id: "emailOtp"
      name: "Email 6-digit OTP Setting"
      messageTitle: "Your OTP Code"
      messageTemplate: "Your OTP code is: ${otp}"
      otpLength: 6
      useLetters: false
      useDigits: true
      ttlMinutes: 3
      sender: "emailOtpSender"

token:
  issuer: "https://passwordless.actvn"
  audience: "passwordless-clients"
  accessTokenLifetimeSeconds: 900
  refreshTokenLifetimeSeconds: 2592000
  signingSecret: "change-this-in-production"

auth:
  transactionTtlSeconds: 300
  lockoutMaxAttempts: 5
  lockoutDurationSeconds: 900
  sessionTtlSeconds: 86400

webauthn:
  settings:
    timeout: 60000
    rpId: localhost
    origin: "http://localhost:8080"

totp:
  issuer: "acme.com"
  issuerLabel: "Acme LLC"

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
    filter: true
    displayRequestDuration: true
  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

oauth2:
  seed:
    enabled: true
    domain-name: default.com
    web-client-id: web-pkce-client
    web-redirect-uri: http://localhost:3000/callback
    service-client-id: service-client
    service-client-secret: ${OAUTH2_SERVICE_CLIENT_SECRET:}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
