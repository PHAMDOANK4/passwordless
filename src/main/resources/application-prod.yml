server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: lax

security:
  relaxed-mode: false

spring:
  jpa:
    open-in-view: false
  liquibase:
    enabled: true

token:
  signingSecret: ${TOKEN_SIGNING_SECRET}

oauth2:
  seed:
    enabled: false
    service-client-secret: ${OAUTH2_SERVICE_CLIENT_SECRET:}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
